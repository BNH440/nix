name: Build and Cache

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  checks: write
  id-token: write

concurrency:
  group: build-${{ github.ref || github.head_ref }}
  cancel-in-progress: true

jobs:
  Atelier:
    uses: stepbrobd/atelier/.github/workflows/discover.yaml@master
